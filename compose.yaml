services:
  database:
    image: postgres:18-alpine
    container_name: postgres-db-job-queue
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: myuser
      POSTGRES_DB: job_queue_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d ff_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  
volumes:
  postgres_data: